services:
  # Redis Cache (Celery broker + app cache)
  - type: redis
    name: chess-insight-redis
    plan: free
    region: oregon
    # Required by Render for Key Value / Redis. Empty list = internal-only (Render private network).
    ipAllowList: []

  # Backend API Service
  - type: web
    name: chess-insight-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      cd backend
      bash scripts/render_install_stockfish.sh .
      test -x stockfish/stockfish
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: |
      cd backend
      uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      # Supabase Postgres + Auth — set in Render dashboard (never commit real values)
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_ALGORITHM
        value: HS256
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: REDIS_HOST
        fromService:
          type: redis
          name: chess-insight-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: chess-insight-redis
          property: port
      - key: REDIS_DB
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_COACH_MAX_TOKENS
        value: 1024
      - key: CHESSCOM_API_BASE_URL
        value: https://api.chess.com/pub
      - key: CHESSCOM_API_RATE_LIMIT
        value: 100
      - key: MAX_GAMES_PER_ANALYSIS
        value: 50
      - key: STOCKFISH_PATH
        value: stockfish/stockfish
      - key: STOCKFISH_DEPTH
        value: 14
      - key: STOCKFISH_TIME
        value: 0.35
      - key: STOCKFISH_THREADS
        value: 1
      - key: STOCKFISH_HASH
        value: 64
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: REPORTS_DIR
        value: /tmp/reports
      - key: ANALYSIS_CACHE_EXPIRE_HOURS
        value: 24
      - key: BACKEND_CORS_ORIGINS
        sync: false
    healthCheckPath: /api/v1/health

  # Celery worker — async game analysis (requires Render Starter+ for type: worker)
  - type: worker
    name: chess-insight-celery
    env: python
    region: oregon
    # Analysis is CPU-bound and every game is its own task, so throughput scales
    # with worker *processes*, not with threads inside one engine.
    #
    # It used to run `--pool=solo --concurrency=1` on Starter (0.5 CPU), which is
    # the only thing that box can do — one game at a time, ~11s each, so 50 games
    # took ~10 min and 200 took ~35. That serialism is why the analysis window was
    # capped at MAX_GAMES_PER_ANALYSIS=50, not the engine itself.
    #
    # On Standard (1 CPU) two prefork children each get the 0.5 CPU a single
    # Starter child had, so per-game time is unchanged while throughput doubles:
    # 100 games drop from ~20 min to ~10. Pro (2 CPU) + CELERY_CONCURRENCY=4 gets
    # ~4x. Keep CELERY_CONCURRENCY <= the plan's CPU count, and keep
    # STOCKFISH_THREADS=1 whenever concurrency > 1 — threads inside one engine
    # oversubscribe the same cores the sibling processes need.
    plan: standard
    buildCommand: |
      cd backend
      bash scripts/render_install_stockfish.sh .
      test -x stockfish/stockfish
      pip install -r requirements.txt
      # Model-side baseline, gated and inert by default. The agent working on this
      # repository has no shell on Render and the LLM credentials exist only here, so
      # the evaluation runs where the credentials are and its report is read out of the
      # build log. Set RUN_MODEL_EVAL_ON_BUILD=true on this service to arm it for one
      # deploy, then unset it — an LLM evaluation must not run on every build.
      if [ "$RUN_MODEL_EVAL_ON_BUILD" = "true" ]; then
        echo "=== MODEL EVAL REPORT (RUN_MODEL_EVAL_ON_BUILD=true) ==="
        python scripts/run_model_eval.py --user-id 1 --json /tmp/model_eval.json || true
        echo "=== END MODEL EVAL REPORT ==="
      fi
    # Render did not retain the generated binary in one deploy. Re-running the
    # idempotent installer at startup guarantees the worker never starts without it.
    # `-B` embeds Celery beat: the worker also runs the scheduled sync + weekly
    # digest entries (gated by CELERY_BEAT_ENABLED / WEEKLY_DIGEST_ENABLED). Beat
    # stays in the parent process under prefork, so it still schedules exactly once.
    # `--prefetch-multiplier=1` (also set in celery_app.py) keeps a child from
    # reserving a batch of games it cannot start yet, which would leave the other
    # children idle while the queue looks busy.
    startCommand: cd backend && bash scripts/render_install_stockfish.sh . && python scripts/verify_celery_worker_env.py && exec celery -A app.celery_app:celery_app worker --loglevel=info -B -Q analysis --pool=prefork --concurrency=${CELERY_CONCURRENCY:-2} --prefetch-multiplier=1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      # How many games are analysed at once. Must not exceed the worker's CPU
      # count; see the plan note above for the arithmetic.
      - key: CELERY_CONCURRENCY
        value: "2"
      # One thread per engine while games run in parallel: the parallelism lives in
      # the process pool, so threads would only fight each other for the same cores.
      - key: STOCKFISH_THREADS
        value: "1"
      - key: CELERY_BEAT_ENABLED
        value: "true"
      - key: WEEKLY_DIGEST_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: REDIS_HOST
        fromService:
          type: redis
          name: chess-insight-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: chess-insight-redis
          property: port
      - key: REDIS_DB
        value: "0"
      - key: SECRET_KEY
        fromService:
          type: web
          name: chess-insight-backend
          envVarKey: SECRET_KEY
      # The profile builder runs on this worker and writes the coach-voice
      # summary through the LLM. Without these the worker silently falls back to
      # the deterministic text — which is why profile summaries read like an
      # engine report while chat (on the backend service) had a working LLM.
      # Referenced from the backend so the credentials live in one place.
      - key: LLM_LOCAL_BASE_URL
        fromService:
          type: web
          name: chess-insight-backend
          envVarKey: LLM_LOCAL_BASE_URL
      - key: LLM_LOCAL_API_KEY
        fromService:
          type: web
          name: chess-insight-backend
          envVarKey: LLM_LOCAL_API_KEY
      - key: LLM_LOCAL_MODEL
        fromService:
          type: web
          name: chess-insight-backend
          envVarKey: LLM_LOCAL_MODEL
      - key: LLM_LOCAL_SESSION_ID
        fromService:
          type: web
          name: chess-insight-backend
          envVarKey: LLM_LOCAL_SESSION_ID
      - key: STOCKFISH_PATH
        value: stockfish/stockfish
      - key: STOCKFISH_DEPTH
        value: 14
      - key: STOCKFISH_TIME
        value: 0.35
      - key: STOCKFISH_THREADS
        value: 1
      - key: STOCKFISH_HASH
        value: 64
      - key: LOG_LEVEL
        value: INFO
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: REPORTS_DIR
        value: /tmp/reports
